name: Apply no-rap render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch pro_pipeline.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pro_pipeline.py")
          text = path.read_text(encoding="utf-8")
          original = text

          old_sig = 'def render_video(self, mode="draft", hd_mode="draft", use_fades=False, use_beat_sync=False, output_dir: Path | None = None, variant_name: str | None = None, variant_overrides: dict | None = None):'
          new_sig = 'def render_video(self, mode="draft", hd_mode="draft", use_fades=False, use_beat_sync=False, output_dir: Path | None = None, variant_name: str | None = None, variant_overrides: dict | None = None, no_rap: bool = False):'
          if old_sig not in text:
              raise SystemExit("Expected render_video signature was not found")
          text = text.replace(old_sig, new_sig, 1)

          old_validate = 'if mode == "final" and not self.validate_project(final=True, no_rap=False):'
          new_validate = 'if mode == "final" and not self.validate_project(final=True, no_rap=no_rap):'
          if old_validate not in text:
              raise SystemExit("Expected render_video final validation was not found")
          text = text.replace(old_validate, new_validate, 1)

          # Propagate no_rap from run_render_flow() into render_video().
          method = re.search(r'(?ms)^    def run_render_flow\(.*?(?=^    def |^# =====|\Z)', text)
          if not method:
              raise SystemExit("run_render_flow() was not found")
          body = method.group(0)
          call = re.search(r'self\.render_video\(', body)
          if not call:
              raise SystemExit("render_video() call inside run_render_flow() was not found")

          start = call.end()
          depth = 1
          i = start
          quote = None
          escaped = False
          while i < len(body):
              ch = body[i]
              if quote:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == quote:
                      quote = None
              else:
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          break
              i += 1
          if depth != 0:
              raise SystemExit("Could not find end of render_video() call")

          args = body[start:i]
          if "no_rap=" not in args:
              new_args = args.rstrip()
              if new_args:
                  new_args += ",\n        no_rap=no_rap"
              else:
                  new_args = "no_rap=no_rap"
              body = body[:start] + new_args + body[i:]
              text = text[:method.start()] + body + text[method.end():]

          if text == original:
              raise SystemExit("No changes were made")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify syntax and fix shape
        run: |
          python -m py_compile pro_pipeline.py
          python - <<'PY'
          from pathlib import Path
          text = Path("pro_pipeline.py").read_text(encoding="utf-8")
          assert 'variant_overrides: dict | None = None, no_rap: bool = False' in text
          assert 'validate_project(final=True, no_rap=no_rap)' in text
          start = text.index('    def run_render_flow(')
          end = text.find('\n    def ', start + 5)
          body = text[start:end if end != -1 else len(text)]
          assert 'self.render_video(' in body
          call_start = body.index('self.render_video(')
          assert 'no_rap=no_rap' in body[call_start:]
          print('no-rap render propagation fix verified')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/_apply_no_rap_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro_pipeline.py .github/workflows/_apply_no_rap_fix.yml
          git commit -m "Fix no-rap render validation propagation"
          git push

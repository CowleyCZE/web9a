name: Apply lip-sync asset regex fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch lip-sync asset matching
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pro_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = r'if re.fullmatch(r"rap\\d{2}(_\\d{2})?", asset_id, flags=re.IGNORECASE):'
          new = r'if re.fullmatch(r"rap_?\\d{2}(?:_\\d{2})?", asset_id, flags=re.IGNORECASE):'
          if old not in text:
              raise SystemExit("Expected inject_lipsync regex was not found")
          text = text.replace(old, new, 1)

          marker = '                # Mažeme rapXX i rapXX_YY\n'
          replacement = (
              '                # Podporujeme všechny historické i současné tvary:\n'
              '                # rap01, rap_01, rap01_01 i rap_01_01.\n'
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify syntax and regex behavior
        run: |
          python -m py_compile pro_pipeline.py
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pro_pipeline.py").read_text(encoding="utf-8")
          assert 'r"rap_?\\d{2}(?:_\\d{2})?"' in text
          pattern = re.compile(r"rap_?\d{2}(?:_\d{2})?", re.IGNORECASE)
          accepted = ["rap01", "rap_01", "rap01_01", "rap_01_01"]
          rejected = ["rap1", "rap_1", "rap001", "rap_01_001", "vid_01"]
          assert all(pattern.fullmatch(x) for x in accepted)
          assert not any(pattern.fullmatch(x) for x in rejected)
          print("lip-sync asset regex verified")
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/_apply_lipsync_regex_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro_pipeline.py .github/workflows/_apply_lipsync_regex_fix.yml
          git commit -m "Fix lip-sync rap asset matching"
          git push

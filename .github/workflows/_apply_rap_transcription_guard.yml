name: Apply rap transcription guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch transcribe_rap_clips return contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('pro_pipeline.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)

          target = None
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name == 'transcribe_rap_clips':
                  target = node
                  break
          if target is None:
              raise SystemExit('transcribe_rap_clips not found')

          lines = text.splitlines(keepends=True)
          start = target.lineno - 1
          end = target.end_lineno
          block = ''.join(lines[start:end])

          if 'RAP_TRANSCRIPTION_STRICT_GUARD' in block:
              print('rap transcription guard already present')
              raise SystemExit(0)

          # No rap clips is a failed production step, not a successful no-op.
          old = '''        if not rap_clips:\n            print("❌ Ve složce gen_rap nebyly nalezeny žádné rap_*.mp4 klipy.")\n            return\n'''
          new = '''        # RAP_TRANSCRIPTION_STRICT_GUARD: missing rap assets are a hard step failure.\n        if not rap_clips:\n            print("❌ Ve složce gen_rap nebyly nalezeny žádné rap_*.mp4 klipy.")\n            return False\n'''
          if old not in block:
              raise SystemExit('expected no-rap block not found')
          block = block.replace(old, new, 1)

          # Provider/tooling failures must also propagate as explicit False.
          replacements = [
              ('''            if not self._groq_ready():\n                return\n''', '''            if not self._groq_ready():\n                print("❌ Rap transkripce zastavena: Groq není připravený.")\n                return False\n'''),
              ('''                return\n            if Path(whisper_bin).name == "whisper-cli":\n''', '''                return False\n            if Path(whisper_bin).name == "whisper-cli":\n'''),
              ('''                return\n\n        song_alignment = self._load_json''', '''                return False\n\n        song_alignment = self._load_json'''),
          ]
          for old, new in replacements:
              if old not in block:
                  raise SystemExit(f'expected tooling guard block not found: {old[:80]!r}')
              block = block.replace(old, new, 1)

          # A partially transcribed rap set must never be reported as successful.
          old_final = '''        if failed_clips:\n            print(f"⚠️  {len(failed_clips)} klip(ů) bez validní transkripce (viz 'transcript_empty' v reportu): {', '.join(failed_clips)}")\n'''
          new_final = '''        if failed_clips:\n            print(f"⚠️  {len(failed_clips)} klip(ů) bez validní transkripce (viz 'transcript_empty' v reportu): {', '.join(failed_clips)}")\n            print("❌ RAP_TRANSCRIPTION_STRICT_GUARD: transkripce rapu je neúplná — další kroky nesmí pokračovat jako by byla hotová.")\n            return False\n\n        expected_ids = {clip.stem for clip in self.gen_rap.glob("rap_*.mp4")}\n        completed_ids = {str(k) for k, v in results.items() if isinstance(v, dict) and not v.get("transcript_empty", False) and (v.get("words_raw") or v.get("words"))}\n        missing_after_run = sorted(expected_ids - completed_ids)\n        if missing_after_run:\n            print(f"❌ RAP_TRANSCRIPTION_STRICT_GUARD: po dokončení stále chybí {len(missing_after_run)} klipů: {', '.join(missing_after_run)}")\n            return False\n\n        print("✅ RAP_TRANSCRIPTION_STRICT_GUARD: všechny rap klipy mají validní word-level transkripci.")\n        return True\n'''
          if old_final not in block:
              raise SystemExit('expected failed_clips final block not found')
          block = block.replace(old_final, new_final, 1)

          text = ''.join(lines[:start]) + block + ''.join(lines[end:])
          path.write_text(text, encoding='utf-8')
          print('rap transcription guard inserted')
          PY

      - name: Verify syntax and behavior contract
        run: |
          python -m py_compile pro_pipeline.py
          python - <<'PY'
          from pathlib import Path
          import ast
          text = Path('pro_pipeline.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          target = next((n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == 'transcribe_rap_clips'), None)
          assert target is not None
          block = ast.get_source_segment(text, target) or ''
          assert 'RAP_TRANSCRIPTION_STRICT_GUARD' in block
          assert 'return False' in block
          assert 'return True' in block
          print('rap transcription guard verified')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/_apply_rap_transcription_guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pro_pipeline.py .github/workflows/_apply_rap_transcription_guard.yml
          git commit -m 'Fail pipeline on incomplete rap transcription'
          git push

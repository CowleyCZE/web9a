name: Apply pipeline hardening 8-15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply points 8, 9, 13, 14 and 15
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pro = Path('pro_pipeline.py')
          text = pro.read_text(encoding='utf-8')
          original = text

          # 13) Jeden robustní parser JSON: fence, BOM, preambule, trailing comma,
          # vyvážené objekty/arrays. Bez evalu a bez slepého nahrazování apostrofů.
          pattern = r'def extract_json_from_text\(text: str\):.*?(?=\ndef [A-Za-z_])'
          replacement = '''def extract_json_from_text(text: str):
              """Robustní fallback parser odpovědi AI.

              Primárně používá sdílený parser pipeline.json_utils; lokální fallback
              zůstává pro standalone režim, ale nikdy nepoužívá eval().
              """
              try:
                  from pipeline.json_utils import parse_json_response
                  return parse_json_response(text, require_dict=True)
              except ImportError:
                  pass
              if not isinstance(text, str) or not text.strip():
                  return None
              cleaned = text.replace("\\ufeff", "").strip()
              cleaned = re.sub(r"^```(?:json|javascript|js)?\\s*", "", cleaned, flags=re.I)
              cleaned = re.sub(r"\\s*```$", "", cleaned).strip()
              try:
                  return json.loads(cleaned)
              except (json.JSONDecodeError, TypeError, ValueError):
                  pass
              for start, opener in enumerate(cleaned):
                  if opener != "{":
                      continue
                  depth = 0
                  in_string = False
                  escaped = False
                  for i in range(start, len(cleaned)):
                      ch = cleaned[i]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif ch == "\\\\":
                              escaped = True
                          elif ch == '"':
                              in_string = False
                          continue
                      if ch == '"':
                          in_string = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              try:
                                  return json.loads(cleaned[start:i + 1])
                              except (json.JSONDecodeError, TypeError, ValueError):
                                  break
              return None
'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Point 13: extract_json_from_text not found')

          # 9) known_ids musí existovat před generováním části 2. Tím se neznámé
          # ID odmítnou na vstupu, nikoliv až po dokončení všech AI chunků.
          anchor = '        sections1 = extract_sections(plan_text1)\n'
          insert = '''        sections1 = extract_sections(plan_text1)

        # EARLY ID GUARD: katalog + ID nově vytvořených promptů jsou známy ještě
        # před prvním chunkem části 2. Každý AI chunk se proti nim validuje okamžitě.
        known_ids = set(klipy.keys()) | {
            m.group(1) for section_name in ("VIDEO_PROMPTS", "RAPPER_PROMPTS", "IMAGE_PROMPTS")
            for m in re.finditer(r'^([a-zA-Z]+_\\d+)\\s*\\|', sections1.get(section_name, ""), re.MULTILINE)
        }
        if not known_ids:
            print("❌ Před generováním části 2 nebyla nalezena žádná známá ID klipů/promptů.")
            return False
'''
          if anchor not in text:
              raise SystemExit('Point 9: sections1 anchor not found')
          text = text.replace(anchor, insert, 1)

          # Po každém AI chunku kontrola ID okamžitě po parse, ještě před appendem.
          anchor = '            chunk_timeline = self._force_align_timeline_chunk_boundaries(chunk_timeline, seg_start, seg_end)\n\n            timeline_parts.append(chunk_timeline)\n'
          insert = '''            chunk_timeline = self._force_align_timeline_chunk_boundaries(chunk_timeline, seg_start, seg_end)

            chunk_id_problems = self._validate_timeline_ids(
                chunk_timeline, chunk_shot_order, known_ids,
            )
            if chunk_id_problems:
                print(f"❌ AI chunk {i}/{n_chunks} obsahuje neznámá ID: {chunk_id_problems[:8]}")
                return False

            timeline_parts.append(chunk_timeline)
'''
          if anchor not in text:
              raise SystemExit('Point 9: chunk validation anchor not found')
          text = text.replace(anchor, insert, 1)

          # 15) sjednocení stavů ve všech correction JSON.
          for old, new in [
              ('"status": "missing"', '"status": "failed"'),
              ('"status": "invalid_media"', '"status": "failed"'),
              ('"status": "error"', '"status": "failed"'),
              ('"status": "no_match"', '"status": "mismatch"'),
          ]:
              text = text.replace(old, new)

          # 14) Starý backup bez provenance se nesmí tiše použít. Pokud chybí hash
          # předchozího výstupu, porovnáme current vs backup; při rozdílu je stav
          # mismatch a krok skončí bez rizika kumulace korekcí.
          old = '''                if not src_backup.exists():
                    if src_current.exists():
                        shutil.copy2(str(src_current), str(src_backup))
                elif prev_output_hash and current_hash and current_hash != prev_output_hash:
                    print(f"  {clip_name}: ℹ️  zjištěn nový obsah v gen_vid/ (liší se od minulého výstupu) — osvěžuji zdrojovou zálohu.")
                    shutil.copy2(str(src_current), str(src_backup))
                src = src_backup if src_backup.exists() else src_current
'''
          new = '''                if not src_backup.exists():
                    if src_current.exists():
                        shutil.copy2(str(src_current), str(src_backup))
                elif not prev_output_hash:
                    backup_hash = file_hash(src_backup)
                    if current_hash and backup_hash and current_hash != backup_hash:
                        corrections[clip_name] = {
                            "status": "mismatch",
                            "speed_factor": 1.0,
                            "target_duration": round(target_duration, 4),
                            "reason": "backup_bez_provenance_a_odlišný_current_obsah",
                        }
                        print(f"  {clip_name}: ⚠️ starý backup bez provenance se liší od current — odmítám jej tiše použít.")
                        continue
                elif current_hash and current_hash != prev_output_hash:
                    print(f"  {clip_name}: ℹ️  zjištěn nový obsah v gen_vid/ — osvěžuji zdrojovou zálohu.")
                    shutil.copy2(str(src_current), str(src_backup))
                src = src_backup if src_backup.exists() else src_current
'''
          if old not in text:
              raise SystemExit('Point 14: vid backup block not found')
          text = text.replace(old, new, 1)

          # 8) Pokud je stejný vid_xx použit vícekrát v timeline, fyzicky jej
          # nepřepočítávej na jedinou (poslední) délku. Render ho loopuje per-slot.
          anchor = '                if not src_current.exists() and not src_backup.exists():\n                    corrections[clip_name] = {\n                        "status": "failed",\n'
          insert = '''                if not src_current.exists() and not src_backup.exists():
                    corrections[clip_name] = {
                        "status": "failed",
'''
          if anchor not in text:
              raise SystemExit('Point 8: missing-file anchor not found')
          # no-op replacement keeps the exact existing block; the real duplicate guard
          # is inserted immediately after its continue.
          text = text.replace(anchor, insert, 1)
          dup_anchor = '                    print(f"  {clip_name}: ❌ chybí soubor v gen_vid/")\n                    continue\n'
          dup_insert = '''                    print(f"  {clip_name}: ❌ chybí soubor v gen_vid/")
                    continue

                if clip_name in duplicate_names:
                    src_for_loop = src_current if src_current.exists() else src_backup
                    if not src_for_loop or not src_for_loop.exists() or probe_duration(src_for_loop) <= 0:
                        corrections[clip_name] = {
                            "status": "failed",
                            "speed_factor": 1.0,
                            "target_duration": round(target_duration, 4),
                        }
                        continue
                    corrections[clip_name] = {
                        "status": "ok",
                        "mode": "render_loop",
                        "loop_policy": "vid_source_loops_per_timeline_slot",
                        "speed_factor": 1.0,
                        "target_duration": round(target_duration, 4),
                        "source_hash": file_hash(src_for_loop),
                    }
                    print(f"  {clip_name}: více slotů → render-time loop, bez fyzického přepočtu zdroje.")
                    continue
'''
          if dup_anchor not in text:
              raise SystemExit('Point 8: duplicate guard anchor not found')
          text = text.replace(dup_anchor, dup_insert, 1)

          # Count clamped as successfully processed in the report.
          text = text.replace(
              'ok_count = sum(1 for c in corrections.values() if c.get("status") == "ok")',
              'ok_count = sum(1 for c in corrections.values() if c.get("status") in ("ok", "clamped"))',
              1,
          )

          # Ensure legacy statuses in human-readable logs use the same model.
          text = text.replace('status=no_match', 'status=mismatch')
          text = text.replace('status=missing', 'status=failed')
          text = text.replace('status=invalid_media', 'status=failed')
          text = text.replace('status=error', 'status=failed')

          if text == original:
              raise SystemExit('No pro_pipeline changes made')
          pro.write_text(text, encoding='utf-8')

          # klipy.py: B-roll budget treats vid_ as loop-capable. A short source can
          # fill a slot at render time, so it must not force needless extra clips.
          kp = Path('klipy.py')
          ktext = kp.read_text(encoding='utf-8')
          koriginal = ktext
          old = '''        def _dur(cid: str) -> float:
            return float(klipy.get(cid, {}).get("duration_sec") or 0.0)
'''
          new = '''        def _dur(cid: str) -> float:
            raw_duration = float(klipy.get(cid, {}).get("duration_sec") or 0.0)
            # vid_ je render-time loopovatelný; pro výběrový budget proto jeho
            # minimální efektivní délku chápeme jako průměrný slot, ne jako délku
            # jediného zdrojového souboru. Tím se výběr a render řídí stejnou logikou.
            if klipy.get(cid, {}).get("group") == "VID":
                return max(raw_duration, average_gap)
            return raw_duration
'''
          if old not in ktext:
              raise SystemExit('Point 8: klipy _dur anchor not found')
          ktext = ktext.replace(old, new, 1)
          if ktext == koriginal:
              raise SystemExit('No klipy changes made')
          kp.write_text(ktext, encoding='utf-8')
          PY

      - name: Verify syntax and hardening invariants
        run: |
          python -m py_compile pro_pipeline.py klipy.py pipeline/*.py
          python - <<'PY'
          from pathlib import Path
          import json
          from pipeline.json_utils import parse_json_response
          from pipeline.models import StepStatus, StepResult
          from pipeline.renderer import video_segment_command

          assert parse_json_response('prefix ```json {"ok": true,} ``` suffix') == {"ok": True}
          assert StepStatus.ALL == {"ok", "clamped", "mismatch", "failed"}
          assert StepResult.success(status="clamped").ok
          assert not StepResult.failure(status="mismatch").ok
          cmd = video_segment_command(Path('vid_01.mp4'), Path('out.mp4'), 4.0, 'null')
          assert '-stream_loop' in cmd and '-1' in cmd

          pro = Path('pro_pipeline.py').read_text(encoding='utf-8')
          klipy = Path('klipy.py').read_text(encoding='utf-8')
          required = [
              'from pipeline.json_utils import parse_json_response',
              'known_ids = set(klipy.keys())',
              'chunk_id_problems',
              'status": "mismatch"',
              'status": "failed"',
              'render_loop',
          ]
          for item in required:
              assert item in pro, item
          assert 'return max(raw_duration, average_gap)' in klipy
          print('Hardening 8-15 checks passed')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/_apply_pipeline_hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pro_pipeline.py klipy.py pipeline .github/workflows/_apply_pipeline_hardening.yml
          git diff --cached --check
          git commit -m "Harden B-roll loops, IDs, JSON, backups and statuses"
          git push
